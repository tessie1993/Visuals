[versions]
kotlin = "2.4.20"
jadx = "1.5.6"
kotlinxSerialization = "1.11.0"
slf4j = "2.0.20"
junit = "6.1.3"
javacv = "1.5.14"
javacpp = "1.5.14"
ffmpeg = "8.1.2-1.5.14"
opencv = "4.14.0-1.5.14"
openblas = "0.3.34-1.5.14"
hipparchus = "4.0.3"

[libraries]
jadx-core = { group = "io.github.skylot", name = "jadx-core", version.ref = "jadx" }
jadx-dex-input = { group = "io.github.skylot", name = "jadx-dex-input", version.ref = "jadx" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
javacv = { group = "org.bytedeco", name = "javacv", version.ref = "javacv" }
javacpp = { group = "org.bytedeco", name = "javacpp", version.ref = "javacpp" }
ffmpeg = { group = "org.bytedeco", name = "ffmpeg", version.ref = "ffmpeg" }
opencv = { group = "org.bytedeco", name = "opencv", version.ref = "opencv" }
openblas = { group = "org.bytedeco", name = "openblas", version.ref = "openblas" }
hipparchus-optim = { group = "org.hipparchus", name = "hipparchus-optim", version.ref = "hipparchus" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
